[package]
name = "obend-ffi"
version = "0.1.0"
edition = "2021"
# Lets dependents read `DEP_OBEND_BRIDGE_LIB_DIR` / `DEP_OBEND_BRIDGE_LEAN_LIB_DIR` from build.rs.
links = "obend_bridge"
description = "Safe Rust C-ABI FFI wrapper and persistent worker thread pool for Obend Lean 4 runtime"
license = "Apache-2.0"

[dependencies]
libc = "0.2"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cc = "1.0"

[features]
default = []
stub = []

