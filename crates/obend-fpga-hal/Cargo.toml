[package]
name = "obend-fpga-hal"
version = "0.1.0"
edition = "2021"
description = "Host-side BAR0 register map for the obend hardware tier and an in-process software model of it (MockBackend); no hardware backend yet"
license = "Apache-2.0"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[[bin]]
name = "obend-silicon-sim"
path = "src/bin/obend-silicon-sim.rs"
