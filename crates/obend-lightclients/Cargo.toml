[package]
name = "obend-lightclients"
version = "0.1.0"
edition = "2021"
description = "S11-hardened Ethereum Electra and CometBFT light-client header admission gates, SSZ Merkle & two-level ICS-23 bank-balance envelope verification, and sealed ProvenForeignHolding"
license = "Apache-2.0"

[dependencies]
# Zero external dependencies: SHA-2, Ed25519 and Montgomery arithmetic come from
# obend-primitives; the S11 admission rules are local.
obend-primitives = { path = "../obend-primitives", features = ["alloc"] }
