[package]
name = "obend-node"
version = "0.1.0"
edition = "2021"
description = "In-process simulator of the Obend consensus, vault and clearing theorems: N simulated validators in one process over loopback, driven against the Lean session; not a deployable validator"
license = "Apache-2.0"

[dependencies]
obend-ffi = { path = "../obend-ffi" }
obend-fpga-hal = { path = "../obend-fpga-hal" }
obend-sandbox = { path = "../obend-sandbox" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
