[package]
name = "obend-node"
version = "0.1.0"
edition = "2021"
description = "Live multi-node runner binding symbolic Simplex BFT, Fog-of-War Merkle multiproofs, and drex-clearing@1 primal-dual LP solving to concrete cryptography and Obend FFI"
license = "Apache-2.0"

[dependencies]
obend-ffi = { path = "../obend-ffi" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
