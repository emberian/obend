# Obend Whole-System Compositional Assurance & Anti-Leaf-Island Manifest
# Audited by `obb apex {status, check}`.
#
# Every `[[apex]]` entry names a real, kernel-checked (`0 sorry`, `0` custom `axiom`) end-to-end
# composition theorem at the top of a subsystem vertical spine. `obb apex` computes the transitive
# reverse module + declaration cone reachable from these Apex theorems + executable entry points,
# reporting per-subsystem Compositional Coverage % and exposing unwired leaf-island modules.

version = 1
target_name = "obend"
default_target_repo = "/Users/ember/dev/obend"

subsystems = [
  "Core",
  "Leaf",
  "Vault",
  "Judge",
  "Hardware",
  "Analysis",
  "Lower",
  "Consensus",
  "Category",
  "Repair",
  "Crypto",
  "Trailblaze",
]

entry_points = [
  "lean/Obend/Main.lean",
  "lean/Obend/FFI.lean",
  "lean/Obend/FFI/Bridge.lean",
  "lean/tools/emitsv/EmitSv.lean",
  "lean/tools/emitcam/EmitCam.lean",
  "lean/tools/emithvm/EmitHvm.lean",
  "lean/tools/emitgpu/EmitGpu.lean",
  "lean/tools/rdna2/Rdna2.lean",
  "lean/tools/litmuscheck/LitmusCheck.lean",
  "lean/tools/journal/Main.lean",
]

