[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "Aeneas"

[[lean_lib]]
name = "ObendKeccak"

[[lean_lib]]
name = "ObendKeccakMirProofs"

[[lean_lib]]
name = "ObendKeccakSpecWeld"

[[lean_lib]]
name = "AuditMirAxioms"

[[require]]
name = "obend"
path = "../../lean"

[[lean_exe]]
name = "audit-mir-axioms"
root = "AuditMirAxiomsMain"
