name = "obend"
version = "0.0.1"
defaultTargets = ["Obend"]

# Two build tiers (2026-11-01; apps and tests moved to tier 2 on 2026-11-04). `lake build` builds
# tier 1, the library: every definition and proof under `Obend/` except `Obend/Apps/`, `Obend/Teeth/` and
# `Obend/Stdlib.lean`. Each tier has a time budget per module, 60 s in tier 1 and 600 s in tier 2,
# enforced by `tools/build.sh tier1|tier2` from Lake's own timings (review/DECISIONS-20261031.md,
# 2026-11-04); the pre-push hook runs tier 1 through it.
# Tier 2 is the teeth (`Obend/Teeth/`: evaluation fixtures, mutation teeth, the legacy leaves), the
# applications (`Obend/Apps/`, concrete `.obend` programs elaborated at compile time), the test suites
# under `tests/` (`Tests`) and the census (`Obend/Census.lean`); it is run before a merge on a build box
# as `lake build Obend.Census Teeth Tests`. Nothing in tier 1 imports tier 2.
# Lake globs cannot exclude, so tier 1 names each top-level module and directory of `Obend/` except
# `Teeth` and `Census`; the census refuses a module under `Obend/` that neither tier builds.
[[lean_lib]]
name = "Obend"
defaultFacets = ["leanArts", "shared"]
globs = [
  "Obend", "Obend.Analysis.+", "Obend.AssertAxioms", "Obend.AssertCompiled", "Obend.Consensus.*", "Obend.Fold.*", "Obend.Intention", "Obend.Kind", "Obend.Kind.+", "Obend.Main", "Obend.Reasons",
  "Obend.Core.+", "Obend.Digest.+", "Obend.Doc.*", "Obend.Elab.*", "Obend.Equiv.+", "Obend.Hardware.*", "Obend.Judge.*",
  "Obend.Law.*", "Obend.Leaf.+", "Obend.Lower.+", "Obend.Ledger", "Obend.Ledger.*", "Obend.Logic.+", "Obend.Receipt.*", "Obend.Run.*", "Obend.Slot.*", "Obend.Spec.*", "Obend.Tactic.+",
  "Obend.Vault.*", "Obend.FFI", "Obend.FFI.*", "Obend.Format.+",
]

# Lane Lower (2026-11-01): the first Lean programs `obend lower` reads (`tests/lower/Programs.lean`, plain
# Lean importing only `Init`). Built on demand: `lake build LowerPrograms` before `obend lower`.
[[lean_lib]]
name = "LowerPrograms"
srcDir = "tests/lower"
roots = ["Programs"]

# Obend.Stdlib elaborates the four stdlib/*.obend at compile time (about four minutes on bb2, 2026-11-04):
# an application of the importer like the Apps, tier 2 with them; nothing in tier 1 imports it.
[[lean_lib]]
name = "Teeth"
globs = ["Obend.Teeth.+", "Obend.Apps.+", "Obend.Stdlib", "Obend.Census", "Obend.Hardware.Fabulous.Mac8Tiles"]

# Tier 2, the test suites (2026-11-04). Until this target existed the 30 files under
# `tests/{metasystem,silicon_elab,rehydration}` (308 theorems, 157 `#tooth` commands) belonged to no
# build target and were never elaborated.
[[lean_lib]]
name = "Tests"
srcDir = "tests"
globs = ["metasystem.+", "silicon_elab.+", "rehydration.+", "vault.+"]

# Lane B (2026-10-30): the declaration-level obligation journal. `Journal.Export` walks the built
# environment; `Journal.Journal` reads two exports as slots. The tool does not `needs` the `Obend`
# library: `lake build` the tree (or the subtree an `--only` export reads) before exporting, so a red
# proof module elsewhere does not block the tool from building.
[[lean_lib]]
name = "Journal"
roots = ["Journal.Journal", "Journal.Export"]

[[lean_exe]]
name = "journal"
srcDir = "tools/journal"
root = "Main"

# Lane A (2026-10-30): the CLI of SHIP §1, rooted at the library module `Obend.Main` (a root named `Main`
# would collide with the journal executable). `lake exe obend check FILE.json` / `lake exe obend run FILE.json`.
# fpga-silicon lane (2026-11-04): regenerates every checked-in `.sv` from its Lean definition; the
# verify scripts compare bytes. Outside the library tier because it imports `Obend.Apps.*`.
# `lake build obend-emit-sv`.
[[lean_exe]]
name = "obend-emit-sv"
srcDir = "tools/emitsv"
root = "EmitSv"
supportInterpreter = true

[[lean_exe]]
name = "obend"
root = "Obend.Main"
# Lane Lower: `obend lower` imports a module with its environment extensions (Lean's equation
# compiler reads them), whose initializers the interpreter runs; Linux needs the symbols exported.
supportInterpreter = true

# cad-cam lane (2026-11-04): writes the fidget program and its `cam-gouge@1` certificate
# (`apps/fidget-cam/cam/`); `Obend.Apps.FidgetCamCert` replays the certificate at build time.
# Outside the library tier because it imports `Obend.Apps.FidgetCam`. `lake exe obend-emit-cam`.
[[lean_exe]]
name = "obend-emit-cam"
srcDir = "tools/emitcam"
root = "EmitCam"
supportInterpreter = true

# Lane HVM (2026-11-05, rung 2 of HARDWARE.md): lowers the Leaf books of `tools/emithvm` to HVM2's
# textual nets (`Obend.Hardware.Hvm`), with the vectors and expected values `hardware/hvm/verify_hvm.sh`
# runs `hvm run` against. `lake build obend-emit-hvm`.
[[lean_exe]]
name = "obend-emit-hvm"
srcDir = "tools/emithvm"
root = "EmitHvm"

# GPU lane (2026-11-05, rung G1 of review/GPU-PROGRAM-20261105.md): lowers the graphs of `tools/emitgpu`
# to WGSL compute shaders, one per wavefront stage (`Obend.Hardware.Gpu`), with the plan and expected
# vectors `hardware/gpu/verify_gpu.sh` runs on the device. `lake build obend-emit-gpu`.
[[lean_exe]]
name = "obend-emit-gpu"
srcDir = "tools/emitgpu"
root = "EmitGpu"

# GPU lane, rung G2 (2026-11-06): the RDNA2 decoder generated from AMD's machine-readable ISA and the wave
# model, on RADV's dumps under `hardware/gpu/isa/` (`Obend.Hardware.Gpu.Rdna2`); `hardware/gpu/isa_check.sh`
# is the gate. `lake build obend-rdna2`.
[[lean_exe]]
name = "obend-rdna2"
srcDir = "tools/rdna2"
root = "Rdna2"
