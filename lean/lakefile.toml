name = "obend"
version = "0.0.1"
defaultTargets = ["Obend"]

# Two build tiers (2026-11-01). `lake build` builds tier 1, the library: every definition and proof
# under `Obend/`. Tier 2 is the teeth (`Obend/Teeth/`: evaluation fixtures, mutation teeth, the legacy
# leaves) and the axiom census (`Obend/Census.lean`); it is run before a push as
# `lake build Obend.Census Teeth`. Nothing in tier 1 imports tier 2.
# Lake globs cannot exclude, so tier 1 names each top-level module and directory of `Obend/` except
# `Teeth` and `Census`; the census refuses a module under `Obend/` that neither tier builds.
[[lean_lib]]
name = "Obend"
globs = [
  "Obend", "Obend.AssertAxioms", "Obend.AssertCompiled", "Obend.Fold", "Obend.Intention", "Obend.Just", "Obend.Main",
  "Obend.Core.+", "Obend.Digest.+", "Obend.Doc.*", "Obend.Elab.*", "Obend.Equiv.+", "Obend.Judge.*",
  "Obend.Law.*", "Obend.Receipt.*", "Obend.Run.*", "Obend.Slot.*", "Obend.Spec.*", "Obend.Tactic.+",
  "Obend.Vault.*",
]

[[lean_lib]]
name = "Teeth"
globs = ["Obend.Teeth.+", "Obend.Census"]

# Lane B (2026-10-30): the declaration-level obligation journal. `Journal.Export` walks the built
# environment; `Journal.Journal` reads two exports as slots. The tool does not `needs` the `Obend`
# library: `lake build` the tree (or the subtree an `--only` export reads) before exporting, so a red
# proof module elsewhere does not block the tool from building.
[[lean_lib]]
name = "Journal"
roots = ["Journal.Journal", "Journal.Export"]

[[lean_exe]]
name = "journal"
srcDir = "tools/journal"
root = "Main"

# Lane A (2026-10-30): the CLI of SHIP §1, rooted at the library module `Obend.Main` (a root named `Main`
# would collide with the journal executable). `lake exe obend check FILE.json` / `lake exe obend run FILE.json`.
[[lean_exe]]
name = "obend"
root = "Obend.Main"
