[package]
name = "obend-hw-ffi"
version = "0.1.0"
edition = "2021"
description = "Rust FFI host & RFC 8949 CBOR / .obnb binary data-munging layer for Obend.Hardware"

[lib]
name = "obend_hw_ffi"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "obend_hw_host"
path = "src/bin/obend_hw_host.rs"

[dependencies]

[workspace]
